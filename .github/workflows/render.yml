name: Render hadith video

# Actions tab → "Render hadith video" → Run workflow
# When it finishes, download the "hadith-video" zip from Artifacts.

on:
  workflow_dispatch:
    inputs:
      test_seconds:
        description: "Test only: render the first N seconds (empty = full video)"
        required: false
        default: ""
        type: string
      workers:
        description: "Parallel browsers (empty = auto, recommended 4)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: render-hadith-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Validate project files
        run: |
          echo "Checking required files..."
          test -f index.html || (echo "::error::index.html not found" && exit 1)
          test -f render.js || (echo "::error::render.js not found" && exit 1)
          test -f package.json || (echo "::error::package.json not found" && exit 1)
          test -f timestamps.txt || test -f timestamps01.txt || (echo "::warning::timestamps.txt not found, render.js will handle")
          ls -lh
          echo "✓ Core files present"

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             ffmpeg             fonts-noto-core             fonts-hosny-amiri             fonts-freefont-ttf             fonts-dejavu-core             fontconfig
          fc-cache -fv
          ffmpeg -version | head -n1
          fc-list | grep -i "Noto.*Bengali" | head -n3 || true
          echo "✓ FFmpeg and fonts installed"

      - name: Install NPM dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium
          npx playwright --version

      - name: Prepare audio and assets check
        run: |
          echo "Assets in repo:"
          ls -lh *.mp3 *.jpg *.jpeg *.png 2>/dev/null || echo "No media in root (check names)"
          if [ -f audio.mp3 ]; then
            echo "Audio duration:"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 audio.mp3 || true
          fi

      - name: Render video
        env:
          TEST_SECONDS: ${{ github.event.inputs.test_seconds }}
          WORKERS: ${{ github.event.inputs.workers }}
        run: |
          set -e
          ARGS=""
          if [ -n "$TEST_SECONDS" ]; then
            echo "▶ Test mode: first $TEST_SECONDS seconds"
            ARGS="$ARGS --test $TEST_SECONDS"
          else
            echo "▶ Full video mode"
          fi
          if [ -n "$WORKERS" ]; then
            echo "▶ Using $WORKERS workers"
            ARGS="$ARGS --workers $WORKERS"
          fi
          echo "Command: node render.js $ARGS"
          node render.js $ARGS
          echo "✓ Render completed"
          ls -lh *.mp4 || (echo "::error::MP4 not generated" && exit 1)

      - name: Verify output
        if: always()
        run: |
          if [ -f hadith-video.mp4 ]; then
            echo "Output info:"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,duration,codec_name -of default=noprint_wrappers=1 hadith-video.mp4 || true
            ls -lh hadith-video.mp4
          else
            echo "::warning::hadith-video.mp4 not found, checking any mp4"
            ls -lh *.mp4 || true
          fi

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadith-video
          path: hadith-video.mp4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload frames on failure (for debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/*.jpg
          if-no-files-found: ignore
          retention-days: 3
