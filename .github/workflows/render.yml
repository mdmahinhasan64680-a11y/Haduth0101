name: Render hadith video

on:
  workflow_dispatch:
    inputs:
      test_seconds:
        description: "Test only: render the first N seconds (empty = full video)"
        required: false
        default: ""
        type: string
      workers:
        description: "Parallel browsers (empty = auto, recommended 4)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: render-hadith-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate project files
        run: |
          echo "Checking required files..."
          test -f index.html || (echo "::error::index.html not found" && exit 1)
          test -f render.js || (echo "::error::render.js not found" && exit 1)
          test -f package.json || (echo "::error::package.json not found" && exit 1)
          ls -lh

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-noto-core \
            fonts-hosny-amiri \
            fonts-freefont-ttf \
            fonts-dejavu-core \
            fontconfig
          fc-cache -fv
          ffmpeg -version | head -n1

      - name: Install NPM dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium

      - name: Prepare assets
        run: |
          ls -lh *.mp3 *.png *.jpg 2>/dev/null || echo "Checking assets..."
          if [ -f audio.mp3 ]; then
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 audio.mp3 || true
          else
            echo "::warning::audio.mp3 not found - will render silent video"
          fi

      - name: Render video
        env:
          TEST_SECONDS: ${{ github.event.inputs.test_seconds }}
          WORKERS: ${{ github.event.inputs.workers }}
        run: |
          set -e
          ARGS=""
          if [ -n "$TEST_SECONDS" ]; then
            echo "▶ Test mode: first $TEST_SECONDS seconds"
            ARGS="$ARGS --test $TEST_SECONDS"
          fi
          if [ -n "$WORKERS" ]; then
            echo "▶ Using $WORKERS workers"
            ARGS="$ARGS --workers $WORKERS"
          fi
          echo "Command: node render.js $ARGS"
          node render.js $ARGS
          ls -lh *.mp4

      - name: Verify output
        if: always()
        run: |
          if [ -f hadith-video.mp4 ]; then
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,codec_name -of default=noprint_wrappers=1 hadith-video.mp4 || true
            ls -lh hadith-video.mp4
          fi

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: hadith-video
          path: hadith-video.mp4
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload frames on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-frames
          path: /tmp/**/f*.jpg
          if-no-files-found: ignore
          retention-days: 3
